[package]
name = "v2c02-fast"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The 2C02 ladder: a per-dot stepper whose sequencer table is measured out of rung 0 at build time and whose datapath is authored, held to rung 0's dot golden and to the frame period."

# Run time: the dot frame contract and nothing else. No node, no netlist.
[dependencies]
nes-bus = { git = "https://github.com/tinymachines/nes-bus", tag = "v0.1.1" }

# Build time only: build.rs runs the switch-level chip for one frame in
# the standard world and records the per-dot event table into OUT_DIR
# (NC-SA-derived, never committed). Without the fetched extern the
# table is empty and the P3 tests SKIP by name.
[build-dependencies]
v2c02-netlist = { path = "../v2c02-netlist" }
v2c02-sim = { path = "../v2c02-sim" }
v2c02-dots = { path = "../v2c02-dots" }
nes-bus = { git = "https://github.com/tinymachines/nes-bus", tag = "v0.1.1" }

[dev-dependencies]
v2c02-dots = { path = "../v2c02-dots" }
ntsc-grid = { git = "https://github.com/tinymachines/ntsc-crt", tag = "v0.2.2" }
